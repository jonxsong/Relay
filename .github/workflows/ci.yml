name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify generated database code
        run: |
          go tool sqlc generate
          git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./...

  migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: relay
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://relay:relay-ci@localhost:5432/relay?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply schema
        run: go tool goose -dir migrations postgres "$DATABASE_URL" up
      - name: Verify reversible migration
        run: |
          go tool goose -dir migrations postgres "$DATABASE_URL" down-to 0
          go tool goose -dir migrations postgres "$DATABASE_URL" up

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/relay.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Console checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:api
      - run: pnpm lint
      - run: pnpm build

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v5
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Scan Go call graph
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Audit production JavaScript dependencies
        run: pnpm --dir web audit --prod --audit-level=high

  integration:
    name: PostgreSQL and NATS vertical slice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: relay
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://relay:relay-ci@localhost:5432/relay?sslmode=disable
      NATS_URL: nats://localhost:4222
      RELAY_PROVIDER: mock
      RELAY_MOCK_DELAY: 5s
      RELAY_INTEGRATION_BASE_URL: http://127.0.0.1:8080/api/v1
      RELAY_API_URL: http://127.0.0.1:8080/api/v1
      RELAY_SESSION_SECRET: relay-ci-session-secret-at-least-32-characters
      RELAY_E2E_API_KEY: relay-ci-browser-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start NATS JetStream
        run: |
          docker run --detach --network host --name relay-nats nats:2.11-alpine --jetstream --http_port=8222
          for attempt in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:8222/healthz && exit 0
            sleep 0.25
          done
          docker logs relay-nats
          exit 1
      - run: go tool goose -dir migrations postgres "$DATABASE_URL" up
      - name: Exercise recovery and duplicate safety
        run: go test -tags=integration -count=1 -run TestIntegration -v ./internal/store
      - name: Build services
        run: |
          go build -o "$RUNNER_TEMP/relay-api" ./cmd/api
          go build -o "$RUNNER_TEMP/relay-controlplane" ./cmd/controlplane
          go build -o "$RUNNER_TEMP/relay-worker" ./cmd/worker
      - name: Start services
        run: |
          "$RUNNER_TEMP/relay-api" >"$RUNNER_TEMP/api.log" 2>&1 &
          "$RUNNER_TEMP/relay-controlplane" >"$RUNNER_TEMP/controlplane.log" 2>&1 &
          "$RUNNER_TEMP/relay-worker" >"$RUNNER_TEMP/worker.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Exercise durable execution
        run: go test -tags=integration -count=1 -v ./integration
      - uses: pnpm/action-setup@v5
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Exercise browser console
        run: pnpm --dir web test:e2e

