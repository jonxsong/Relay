name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify generated database code
        run: |
          go tool sqlc generate
          git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./...

  migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: relay
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://relay:relay-ci@localhost:5432/relay?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply schema
        run: go tool goose -dir migrations postgres "$DATABASE_URL" up
      - name: Verify reversible migration
        run: |
          go tool goose -dir migrations postgres "$DATABASE_URL" down-to 0
          go tool goose -dir migrations postgres "$DATABASE_URL" up

