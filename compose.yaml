name: relay

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relay}
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay-local-only}
    ports:
      - "5432:5432"
    volumes:
      - relay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - relay-nats:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: deploy/relay.Dockerfile
    entrypoint: ["/app/goose"]
    command: ["-dir", "/app/migrations", "postgres", "postgres://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relay-local-only}@postgres:5432/${POSTGRES_DB:-relay}?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: deploy/relay.Dockerfile
    restart: unless-stopped
    environment: &relay-environment
      DATABASE_URL: postgres://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relay-local-only}@postgres:5432/${POSTGRES_DB:-relay}?sslmode=disable
      NATS_URL: nats://nats:4222
      RELAY_ENV: ${RELAY_ENV:-development}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-info}
      RELAY_PROVIDER: ${RELAY_PROVIDER:-mock}
      RELAY_GLOBAL_CONCURRENCY: ${RELAY_GLOBAL_CONCURRENCY:-100}
      RELAY_RUN_CONCURRENCY: ${RELAY_RUN_CONCURRENCY:-10}
      RELAY_MAX_RETRIES: ${RELAY_MAX_RETRIES:-3}
      RELAY_WORKER_LEASE: ${RELAY_WORKER_LEASE:-45s}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  controlplane:
    build:
      context: .
      dockerfile: deploy/relay.Dockerfile
    entrypoint: ["/app/relay-controlplane"]
    restart: unless-stopped
    environment: *relay-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: deploy/relay.Dockerfile
    entrypoint: ["/app/relay-worker"]
    restart: unless-stopped
    environment: *relay-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      RELAY_API_URL: http://api:8080/api/v1
      RELAY_SESSION_SECRET: ${RELAY_SESSION_SECRET:-development-only-session-secret-change-me}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  relay-postgres:
  relay-nats:

