services:
  - type: web
    name: relay-console
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./deploy/render.Dockerfile
    dockerContext: .
    healthCheckPath: /
    maxShutdownDelaySeconds: 60
    domains:
      - relay.jonzhang.dev
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-postgres
          property: connectionString
      - key: RELAY_ENV
        value: production
      - key: RELAY_PROVIDER
        value: mock
      - key: RELAY_API_KEY
        generateValue: true
      - key: RELAY_SESSION_SECRET
        generateValue: true
      - key: RELAY_RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: RELAY_GLOBAL_CONCURRENCY
        value: "25"
      - key: RELAY_RUN_CONCURRENCY
        value: "5"

databases:
  - name: relay-postgres
    databaseName: relay
    user: relay
    plan: free
    region: oregon
    ipAllowList: []
