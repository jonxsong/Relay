<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Relay mark</title>
  <desc id="desc">Three connected violet nodes forming a relay path</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="rough"><feTurbulence baseFrequency="0.025" numOctaves="2" seed="8" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8"/></filter>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="25" fill="#10101a" stroke="#34344a" stroke-width="2"/>
  <path d="M24 66 C37 51 44 50 53 34 C58 25 66 23 74 27" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" filter="url(#rough)"/>
  <circle cx="24" cy="66" r="10" fill="#10101a" stroke="#a78bfa" stroke-width="5"/>
  <circle cx="51" cy="38" r="10" fill="#10101a" stroke="#8b5cf6" stroke-width="5"/>
  <circle cx="74" cy="27" r="10" fill="#10101a" stroke="#22d3ee" stroke-width="5"/>
</svg>
